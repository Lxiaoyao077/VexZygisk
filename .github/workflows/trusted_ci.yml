name: Trusted CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # INFO: The host tests exercise in-tree sources only (the ELF reader,
        #       the mountinfo and APatch parsers), so neither the submodules
        #       nor the history of the build job are needed here. Keeping this
        #       job separate lets a broken test fail fast and loudly without
        #       costing the archives, and vice versa.
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Protocol consistency
        # INFO: The loader and the daemon implement their own halves of the
        #       wire protocol; this fails fast if one side edits the action
        #       enum or the helper surface without the other.
        run: python3 tests/host/check_protocol.py

      - name: Host unit tests
        # INFO: The loader cannot run on this host, but its ELF reader can, and
        #       so can the mini-debug decompressor. A broken parse or a wrong
        #       symbol then fails the build instead of showing up only on a
        #       device as a module that silently does not load.
        run: |
          cc -std=c18 -D_GNU_SOURCE -Wall -Wextra -Werror \
             -Itests/host -Iloader/src/include -Iloader/src/common \
             -Iloader/src/external/lzma \
             -c loader/src/common/elf_util.c -o /tmp/elf_util.o
          cc -std=c18 -D_GNU_SOURCE -w \
             -DXZ_DEC_DYNALLOC=1 -DXZ_DEC_ANY_CHECK=1 -DXZ_INTERNAL_CRC32=1 \
             -DNOINLINE=noinline_for_stack \
             -Iloader/src/external/lzma \
             -c loader/src/external/lzma/xz_dec_lzma2.c -o /tmp/xz_lzma2.o
          cc -std=c18 -D_GNU_SOURCE -w \
             -DXZ_DEC_DYNALLOC=1 -DXZ_DEC_ANY_CHECK=1 -DXZ_INTERNAL_CRC32=1 \
             -DNOINLINE=noinline_for_stack \
             -Iloader/src/external/lzma \
             -c loader/src/external/lzma/xz_dec_stream.c -o /tmp/xz_stream.o
          cc -std=c18 -D_GNU_SOURCE -w \
             -DXZ_DEC_DYNALLOC=1 -DXZ_DEC_ANY_CHECK=1 -DXZ_INTERNAL_CRC32=1 \
             -DNOINLINE=noinline_for_stack \
             -Iloader/src/external/lzma \
             -c loader/src/external/lzma/xz_dec_bcj.c -o /tmp/xz_bcj.o
          cc -std=c18 -D_GNU_SOURCE -Wall -Wextra -Werror \
             -Itests/host -Iloader/src/include -Iloader/src/common \
             -Iloader/src/external/lzma \
             tests/host/test_elf_util.c /tmp/elf_util.o /tmp/xz_lzma2.o \
             /tmp/xz_stream.o /tmp/xz_bcj.o \
             -o /tmp/test_elf_util
          python3 tests/host/make_debugdata.py /tmp/debugdata
          /tmp/test_elf_util /tmp/debugdata /tmp/test_elf_util

          cc -std=c18 -D_GNU_SOURCE -Wall -Wextra -Werror \
             -Itests/host -Iloader/src/include \
             tests/host/test_unmount.c -o /tmp/test_unmount
          /tmp/test_unmount

          cc -std=c18 -D_GNU_SOURCE -Wall -Wextra -Werror -DROOT_IMPL_APATCH \
             -Itests/host -Iloader/src/include \
             tests/host/test_unmount.c -o /tmp/test_unmount_apatch
          /tmp/test_unmount_apatch

          cc -std=c18 -D_GNU_SOURCE -Wall -Wextra -Werror \
             -Itests/host -Izygiskd/src -Izygiskd/src/root_impl \
             tests/host/test_apatch.c -o /tmp/test_apatch
          /tmp/test_apatch

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup keys
        env:
          private_key: ${{ secrets.ORG_PRIVATE_KEY }}
          public_key: ${{ secrets.ORG_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "Private or public key is not set."
          else
            echo "$private_key" | base64 -d > module/private_key
            echo "$public_key" | base64 -d > module/public_key
          fi

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)
          make apatch -j$(nproc)
          make apatch-debug -j$(nproc)

      - name: Binary size budget
        run: python3 scripts/ci_size_budget.py build build-apatch

      - name: Generate update.json
        run: |
          python3 scripts/make_update_json.py --tree build --output build/out/update.json --pattern "VexZygisk-v*-release.zip"
          python3 scripts/make_update_json.py --tree build-apatch --output build-apatch/out/update-apatch.json --pattern "VexZygisk-APatch-v*-release.zip"

      - name: Upload update.json
        uses: actions/upload-artifact@v7
        with:
          name: update.json
          path: "build/out/update.json"
          archive: false

      - name: Upload APatch update.json
        uses: actions/upload-artifact@v7
        with:
          name: update-apatch.json
          path: "build-apatch/out/update-apatch.json"
          archive: false

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-release.zip"
          archive: false

      - name: Upload APatch release
        uses: actions/upload-artifact@v7
        with:
          path: "build-apatch/out/VexZygisk-APatch-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-debug.zip"
          archive: false

      - name: Upload APatch debug
        uses: actions/upload-artifact@v7
        with:
          path: "build-apatch/out/VexZygisk-APatch-v*-debug.zip"
          archive: false
