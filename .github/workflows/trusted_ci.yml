name: Trusted CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup keys
        env:
          private_key: ${{ secrets.ORG_PRIVATE_KEY }}
          public_key: ${{ secrets.ORG_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "Private or public key is not set."
          else
            echo "$private_key" | base64 -d > module/private_key
            echo "$public_key" | base64 -d > module/public_key
          fi

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)
          make apatch -j$(nproc)

      - name: Binary size budget
        # INFO: libzygisk.so statically links five engines (csoloader, PLTI,
        #       Dobby, LSPlt and the LZMA decoder), so a careless dependency
        #       can balloon it unnoticed. The limits sit roughly 15% above
        #       the sizes at the time the budget was introduced; raise them
        #       deliberately when a feature genuinely needs the space.
        run: |
          python3 - <<'PY'
          import os
          import sys

          budget_kib = {
              "build/obj/release/loader/arm64-v8a/stripped/libzygisk.so": 430,
              "build/obj/release/loader/armeabi-v7a/stripped/libzygisk.so": 330,
              "build/obj/release/loader/arm64-v8a/stripped/libzygisk_ptrace.so": 100,
              "build/obj/release/loader/armeabi-v7a/stripped/libzygisk_ptrace.so": 100,
              "build/obj/release/zygiskd/arm64-v8a/zygiskd": 56,
              "build/obj/release/zygiskd/armeabi-v7a/zygiskd": 52,
              "build-apatch/obj/release/loader/arm64-v8a/stripped/libzygisk.so": 430,
              "build-apatch/obj/release/loader/armeabi-v7a/stripped/libzygisk.so": 330,
              "build-apatch/obj/release/loader/arm64-v8a/stripped/libzygisk_ptrace.so": 100,
              "build-apatch/obj/release/loader/armeabi-v7a/stripped/libzygisk_ptrace.so": 100,
              "build-apatch/obj/release/zygiskd/arm64-v8a/zygiskd": 60,
              "build-apatch/obj/release/zygiskd/armeabi-v7a/zygiskd": 56,
          }

          failed = False

          for path, limit in sorted(budget_kib.items()):
              if not os.path.exists(path):
                  print(f"MISSING                {path}")
                  failed = True

                  continue

              actual = os.path.getsize(path) // 1024
              over = actual > limit
              failed = failed or over

              print(f"{actual:6} KiB / {limit:6} KiB  {'OVER' if over else 'ok  '}  {path}")

          sys.exit(1 if failed else 0)
          PY

      - name: Host unit tests
        # INFO: The loader cannot run on this host, but its ELF reader can, and
        #       so can the mini-debug decompressor. A broken parse or a wrong
        #       symbol then fails the build instead of showing up only on a
        #       device as a module that silently does not load.
        run: |
          cc -std=c18 -D_GNU_SOURCE -Wall -Wextra -Werror \
             -Itests/host -Iloader/src/include -Iloader/src/common \
             -Iloader/src/external/lzma \
             -c loader/src/common/elf_util.c -o /tmp/elf_util.o
          cc -std=c18 -D_GNU_SOURCE -w \
             -Iloader/src/external/lzma \
             -c loader/src/external/lzma/LzmaDec.c -o /tmp/lzma_dec.o
          cc -std=c18 -D_GNU_SOURCE -Wall -Wextra -Werror \
             -Itests/host -Iloader/src/include -Iloader/src/common \
             -Iloader/src/external/lzma \
             tests/host/test_elf_util.c /tmp/elf_util.o /tmp/lzma_dec.o \
             -o /tmp/test_elf_util
          python3 tests/host/make_debugdata.py /tmp/debugdata
          /tmp/test_elf_util /tmp/debugdata /tmp/test_elf_util

      - name: Generate update.json
        # INFO: Built here rather than committed by hand so it can never drift
        #       from the zip it points at. The release itself is still created
        #       manually: nothing here pushes a tag, a release or a commit, so
        #       the file is published with the release when one is cut.
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import subprocess

          archives = glob.glob("build/out/VexZygisk-v*-release.zip")
          if not archives:
              raise SystemExit("no release archive found")

          # INFO: Lexicographic order would pick v2.1.9 over v2.1.10, so the
          #       newest archive is the one with the highest versionCode.
          def archive_version_code(path):
              match = re.search(r"-v[^-]+-(\d+)-[0-9a-f]+-release\.zip$", os.path.basename(path))
              if not match:
                  raise SystemExit(f"cannot parse versionCode from {path}")
              return int(match.group(1))

          archive = max(archives, key=archive_version_code)
          name = os.path.basename(archive)

          # VexZygisk-<version>-<versionCode>-<commit>-release.zip
          version, version_code = name.split("-")[1:3]

          previous = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0"],
              capture_output=True, text=True).stdout.strip()

          # INFO: The zipUrl points at a release named exactly after the
          #       version; warn while it is still cheap to notice.
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              capture_output=True, text=True).stdout.strip()

          tag = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{version}"],
              capture_output=True, text=True).stdout.strip()

          if not tag:
              print(f"WARNING: tag {version} does not exist yet; "
                    f"update.json's zipUrl will 404 until it is cut")
          elif tag != head:
              print(f"WARNING: tag {version} does not point at HEAD ({tag})")

          revisions = f"{previous}..HEAD" if previous else "-50"
          commits = subprocess.run(
              ["git", "log", "--pretty=- %s", revisions],
              capture_output=True, text=True).stdout.strip()

          update = {
              "version": version,
              "versionCode": int(version_code),
              "zipUrl": "https://github.com/{}/releases/download/{}/{}".format(
                  os.environ["GITHUB_REPOSITORY"], version, name),
              "changelog": "VexZygisk {}\n\n{}".format(version, commits),
          }

          with open("build/out/update.json", "w") as file:
              json.dump(update, file, indent=2, ensure_ascii=False)
              file.write("\n")

          print(json.dumps(update, indent=2))
          PY

      - name: Upload update.json
        uses: actions/upload-artifact@v7
        with:
          name: update.json
          path: "build/out/update.json"

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-release.zip"
          archive: false

      - name: Upload APatch release
        uses: actions/upload-artifact@v7
        with:
          path: "build-apatch/out/VexZygisk-APatch-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-debug.zip"
          archive: false
