name: Trusted CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # INFO: The host tests exercise in-tree sources only (the ELF reader,
        #       the mountinfo and APatch parsers), so neither the submodules
        #       nor the history of the build job are needed here. Keeping this
        #       job separate lets a broken test fail fast and loudly without
        #       costing the archives, and vice versa.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Host unit tests
        # INFO: Shared with the Untrusted CI through tests/host/run.sh, so a
        #       pull request is judged by the very same commands that run here
        #       after the merge. The suite exercises in-tree sources only (the
        #       ELF reader, the mountinfo and APatch parsers), so neither the
        #       submodules nor the history the build job needs are checked out,
        #       which lets a broken test fail fast without costing the archives.
        run: bash tests/host/run.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup keys
        env:
          private_key: ${{ secrets.ORG_PRIVATE_KEY }}
          public_key: ${{ secrets.ORG_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "Private or public key is not set."
          else
            echo "$private_key" | base64 -d > module/private_key
            echo "$public_key" | base64 -d > module/public_key
          fi

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)
          make apatch -j$(nproc)
          make apatch-debug -j$(nproc)

      - name: Binary size budget
        run: python3 scripts/ci_size_budget.py build build-apatch

      - name: Generate update.json
        run: |
          python3 scripts/make_update_json.py --tree build --output build/out/update.json --pattern "VexZygisk-v*-release.zip"
          python3 scripts/make_update_json.py --tree build-apatch --output build-apatch/out/update-apatch.json --pattern "VexZygisk-APatch-v*-release.zip"

      - name: Upload update.json
        uses: actions/upload-artifact@v7
        with:
          name: update.json
          path: "build/out/update.json"
          archive: false

      - name: Upload APatch update.json
        uses: actions/upload-artifact@v7
        with:
          name: update-apatch.json
          path: "build-apatch/out/update-apatch.json"
          archive: false

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-release.zip"
          archive: false

      - name: Upload APatch release
        uses: actions/upload-artifact@v7
        with:
          path: "build-apatch/out/VexZygisk-APatch-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-debug.zip"
          archive: false

      - name: Upload APatch debug
        uses: actions/upload-artifact@v7
        with:
          path: "build-apatch/out/VexZygisk-APatch-v*-debug.zip"
          archive: false
