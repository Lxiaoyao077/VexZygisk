<div class="page-scroller">

  <!-- INFO: Hero status card -->
  <div class="hero-card">
    <div class="hero-content">
      <div class="hero-label">VexZygisk</div>
      <div class="hero-value" id="rz_state">{{unknown}}</div>
    </div>
    <div class="hero-badges">
      <span class="mode-indicator" id="monitor_pill">{{unknown}}</span>
    </div>
  </div>

  <!-- INFO: Zygote metrics -->
  <div class="metrics-row">
    <div class="metric-card">
      <div class="metric-icon-bg">
        <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v4a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5zM4 11a1 1 0 0 1 1 1 7 7 0 0 0 14 0 1 1 0 0 1 2 0 9 9 0 0 1-8 8.94V23a1 1 0 0 1-2 0v-2.06A9 9 0 0 1 3 12a1 1 0 0 1 1-1z"/></svg>
      </div>
      <div class="metric-value" id="zygote64_state">{{unknown}}</div>
      <div class="metric-label">Zygote 64</div>
    </div>
    <div class="metric-card">
      <div class="metric-icon-bg">
        <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v4a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5zM4 11a1 1 0 0 1 1 1 7 7 0 0 0 14 0 1 1 0 0 1 2 0 9 9 0 0 1-8 8.94V23a1 1 0 0 1-2 0v-2.06A9 9 0 0 1 3 12a1 1 0 0 1 1-1z"/></svg>
      </div>
      <div class="metric-value" id="zygote32_state">{{unknown}}</div>
      <div class="metric-label">Zygote 32</div>
    </div>
  </div>

  <!-- INFO: System / Root info -->
  <div class="info-card">
    <div class="card-title">{{androidVersion}} / Kernel</div>
    <div class="info-row">
      <div>
        <div class="info-label">{{androidVersion}}</div>
        <div class="info-sub" id="android_version_div">{{unknown}}</div>
      </div>
    </div>
    <div class="info-row">
      <div>
        <div class="info-label">{{linuxKernelVersion}}</div>
        <div class="info-sub" id="kernel_version_div">{{unknown}}</div>
      </div>
    </div>
  </div>

  <div class="info-card">
    <div class="card-title">Root / VexZygisk</div>
    <div class="info-row">
      <div>
        <div class="info-label">{{info.version}}</div>
      </div>
      <div class="info-value" id="version_code">{{unknown}}</div>
    </div>
    <div class="info-row">
      <div>
        <div class="info-label">{{info.root}}</div>
      </div>
      <div class="info-value" id="root_impl">{{unknown}}</div>
    </div>
    <div class="info-row">
      <div>
        <div class="info-label">{{monitor.title}}</div>
        <div class="info-sub" id="monitor_status">{{unknown}}</div>
      </div>
    </div>
  </div>

</div>
